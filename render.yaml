services:
  # UNIFIED SINGLE WEB SERVICE (FastAPI Backend + React Frontend Bundle)
  - type: web
    name: quantum-route-ai
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && python run.py"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.13.3
